name: Apply Ataru GA4 measurement ID

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ataru-ga4-id.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ga4-measurement-refactor-87bol9
          fetch-depth: 0
      - name: Replace Ataru measurement ID
        run: |
          python - <<'PY'
          from pathlib import Path
          placeholder = '<<NEW_ATARU_ID>>'
          new = 'G-5Z48YLCKNG'
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if placeholder in text:
                  path.write_text(text.replace(placeholder, new), encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No files contained the Ataru placeholder')
          print('\n'.join(changed))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ga4): set Ataru measurement ID"
          git push origin HEAD:claude/ga4-measurement-refactor-87bol9
