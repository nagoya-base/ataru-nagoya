name: Apply Ataru GA4 measurement ID

on:
  push:
    branches:
      - claude/ga4-measurement-refactor-87bol9
    paths:
      - .github/workflows/apply-ataru-ga4-id.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ga4-measurement-refactor-87bol9
          fetch-depth: 0
      - name: Replace placeholder
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('main.html'), Path('profile.html'), Path('ANALYTICS.md')]
          placeholder = '<<NEW_ATARU_ID>>'
          measurement_id = 'G-5Z48YLCKNG'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if placeholder in text:
                  path.write_text(text.replace(placeholder, measurement_id), encoding='utf-8')

          remaining = []
          for path in Path('.').rglob('*'):
              if path.is_file() and '.git' not in path.parts:
                  try:
                      if placeholder in path.read_text(encoding='utf-8'):
                          remaining.append(str(path))
                  except UnicodeDecodeError:
                      pass
          if remaining:
              raise SystemExit(f'Placeholder remains in: {remaining}')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-ataru-ga4-id.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html main.html profile.html ANALYTICS.md .github/workflows/apply-ataru-ga4-id.yml
          git commit -m "fix(ga4): set Ataru measurement ID"
          git push origin HEAD:claude/ga4-measurement-refactor-87bol9
