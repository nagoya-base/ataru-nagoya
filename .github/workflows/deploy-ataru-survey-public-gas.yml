name: deploy-ataru-survey-public-gas

# 公開GAS（gas/ataru_survey_public）を、mainへのマージ後に既存のWeb Appへ自動反映する。
# - PRでは実行しない（GASを更新しない）
# - 新規deploymentは作らず、既存deploymentを更新して /exec URL とアクセス設定を維持する
# - 管理者GAS（gas/ataru_survey_admin）は別workflowで管理する

on:
  push:
    branches: [main]
    paths:
      - 'gas/ataru_survey_public/**'
      - 'survey-schema.json'
      - 'scripts/sync-survey-schema.js'
      - 'scripts/lib/**'
      - '.github/workflows/deploy-ataru-survey-public-gas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ataru-survey-public-gas
  cancel-in-progress: false

env:
  CLASP_VERSION: '3.4.1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify survey-schema.json generates no diff (sync check)
        run: node scripts/sync-survey-schema.js --check

      - name: Run tests
        run: node --test

      - name: Verify required secrets are set
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.ATARU_SURVEY_PUBLIC_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.ATARU_SURVEY_PUBLIC_DEPLOYMENT_ID }}
        run: |
          missing=0
          for name in CLASPRC_JSON SCRIPT_ID DEPLOYMENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for ${name} is not set (see gas/ataru_survey_public/README.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Stage GAS files
        run: |
          set -euo pipefail
          src=gas/ataru_survey_public
          dist="$RUNNER_TEMP/ataru_survey_public_dist"
          mkdir -p "$dist"
          for f in Code.gs PublicSchema.gs PublicAggregate.gs FullSchema.gs ResponseNormalize.gs appsscript.json; do
            cp "$src/$f" "$dist/$f"
          done
          echo "GAS_DIST=$dist" >> "$GITHUB_ENV"

      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.ATARU_SURVEY_PUBLIC_SCRIPT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_ID"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$GAS_DIST/.clasp.json"

      - name: Install clasp
        run: npm install --global "@google/clasp@${CLASP_VERSION}"

      - name: clasp push
        working-directory: ${{ env.GAS_DIST }}
        run: clasp push --force

      - name: Update existing deployment
        working-directory: ${{ env.GAS_DIST }}
        env:
          DEPLOYMENT_ID: ${{ secrets.ATARU_SURVEY_PUBLIC_DEPLOYMENT_ID }}
        run: |
          echo "::add-mask::$DEPLOYMENT_ID"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "ataru-survey-public ${GITHUB_SHA}"

      - name: Verify live API (overview.Q1 has no legacy 50歳以上 bucket)
        env:
          DEPLOYMENT_ID: ${{ secrets.ATARU_SURVEY_PUBLIC_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DEPLOYMENT_ID"
          url="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec?action=results"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$url" -o "$RUNNER_TEMP/results.json" && node -e '
              const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const q1 = d.overview && d.overview.Q1;
              if (!q1) { console.error("overview.Q1 missing"); process.exit(1); }
              if (JSON.stringify(q1).includes("50歳以上")) { console.error("overview.Q1 still contains 50歳以上"); process.exit(1); }
              console.log("overview.Q1 OK (no 50歳以上)");
            ' "$RUNNER_TEMP/results.json"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live API verification failed"
          exit 1

      - name: Remove clasp credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" "$GAS_DIST/.clasp.json"
