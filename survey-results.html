<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F2EFE9; --bg-card: #FDFCF9; --bg-card2: #E8EDF4;
  --accent: #1D3557; --accent-lt: #457B9D; --text: #1C1A17;
  --text-muted: #6A6258; --border: #DDD8CF;
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;
  font-size: 15px; line-height: 1.8; -webkit-font-smoothing: antialiased;
  min-height: 100vh; padding: 1.5rem 1rem 3rem;
}
.wrap { max-width: 640px; margin: 0 auto; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.75rem 1.5rem; margin-top: 1rem; }
.brand { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.2em; color: var(--accent-lt); text-transform: uppercase; }
h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.03em; margin: 0.6rem 0 1rem; line-height: 1.5; }
h2 { font-size: 1.02rem; font-weight: 800; margin: 0 0 0.7rem; }
.notice-box { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px; padding: 1.1rem 1.25rem; margin-bottom: 1.1rem; font-size: 0.86rem; line-height: 1.85; }
.notice-box p + p { margin-top: 0.5rem; }
.stat-line { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.3rem; }
.stat-line strong { color: var(--accent); font-size: 1.15rem; }
.q-block { margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--border); }
.q-block:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
.opt-row { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.85rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--border); }
.opt-row:last-child { border-bottom: none; }
.opt-name { flex: 1; }
.opt-num { color: var(--text-muted); white-space: nowrap; }
.target-note { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.5rem; line-height: 1.7; }
.hidden-note { font-size: 0.82rem; color: var(--text-muted); font-style: normal; padding: 0.6rem 0; }
.btn { display: inline-block; width: 100%; padding: 0.9rem 1.5rem; border-radius: 6px; font-size: 0.92rem; font-weight: 700; letter-spacing: 0.05em; border: none; cursor: pointer; transition: all .15s; text-align: center; text-decoration: none; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body data-site-section="survey" data-page-type="survey_results">
<div class="wrap">
  <p class="brand">ATARU</p>
  <section class="card">
    <h1>アンケート結果</h1>
    <div id="loading-state" class="notice-box"><p>読み込んでいます…</p></div>
    <div id="error-state" class="notice-box" hidden><p>結果の取得に失敗しました。時間をおいて再度お試しください。</p></div>
    <div id="result-root" hidden></div>
  </section>
  <section class="card">
    <a class="btn btn-outline" href="survey.html">アンケートに回答する</a>
  </section>
</div>
<script src="analytics.js"></script>
<script src="survey-results.js"></script>
</body>
</html>
