<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif; background: #F2EFE9; color: #1C1A17; margin: 0; padding: 1.5rem; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .brand { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.15em; color: #457B9D; text-transform: uppercase; margin: 0; }
  h1 { font-size: 1.4rem; margin: 0.4rem 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.8rem; color: #1D3557; }
  .card { background: #FDFCF9; border: 1px solid #DDD8CF; border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
  .hint { font-size: 0.78rem; color: #6A6258; margin: 0 0 0.9rem; line-height: 1.6; }
  .loading, .error { font-size: 0.85rem; }
  .error { color: #9c2f24; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
  .stat-box { flex: 1 1 140px; background: #E8EDF4; border-radius: 8px; padding: 0.8rem 1rem; }
  .stat-box .num { font-size: 1.4rem; font-weight: 800; color: #1D3557; }
  .stat-box .label { font-size: 0.72rem; color: #6A6258; }
  table.agg-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 0.4rem; }
  table.agg-table th, table.agg-table td { border-bottom: 1px solid #DDD8CF; padding: 0.35rem 0.5rem; text-align: left; }
  .q-card { border: 1px solid #DDD8CF; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; }
  .q-card h3 { font-size: 0.9rem; margin: 0 0 0.3rem; }
  .q-card .target { font-size: 0.72rem; color: #6A6258; margin-bottom: 0.3rem; }
  .badge { display: inline-block; font-size: 0.62rem; font-weight: 800; padding: 0.1rem 0.45rem; border-radius: 999px; margin-left: 0.4rem; }
  .badge-base { background: #d8ecd8; color: #2f6b2f; }
  .badge-gated { background: #e8edf4; color: #1D3557; }
  .badge-admin { background: #f3d9d5; color: #8a3b2e; }
  details summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; }
  .cross-table-wrap { overflow-x: auto; margin-bottom: 1rem; }
  .accordion-item { border-bottom: 1px solid #DDD8CF; padding: 0.5rem 0; }
  .accordion-item summary { font-size: 0.86rem; font-weight: 700; }
  pre.freetext-list { white-space: pre-wrap; font-size: 0.82rem; background: #F2EFE9; border-radius: 6px; padding: 0.6rem; max-height: 220px; overflow-y: auto; }
  .q-card, .stat-box, .bar-item { min-width: 0; }
  .q-card h3, .bar-label, .bar-value, .stat-box .num, pre.freetext-list, table.agg-table td, table.agg-table th { overflow-wrap: anywhere; word-break: break-word; }
  .bar-list { margin-top: 0.5rem; }
  .bar-item { margin-bottom: 0.65rem; }
  .bar-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; font-size: 0.82rem; margin-bottom: 0.2rem; }
  .bar-label { flex: 1 1 auto; min-width: 0; }
  .bar-value { flex: 0 0 auto; white-space: nowrap; font-weight: 700; color: #1D3557; font-variant-numeric: tabular-nums; }
  .bar-track { height: 0.6rem; background: #E8EDF4; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: #457B9D; border-radius: 999px; }
  .date-bars h3 { font-size: 0.9rem; margin: 1rem 0 0.4rem; }
  details summary { min-height: 44px; display: flex; align-items: center; }
  .cross-table-wrap { max-width: 100%; -webkit-overflow-scrolling: touch; }
  .cross-table-wrap::after { content: '← 横にスクロールできます →'; display: block; font-size: 0.68rem; color: #6A6258; text-align: right; margin-top: 0.2rem; }
  table.cross-table { width: auto; min-width: 100%; }
  table.cross-table td:first-child { position: sticky; left: 0; background: #FDFCF9; font-weight: 700; }
  @media (max-width: 640px) {
    body { padding: 0.75rem; }
    .card { padding: 1rem; margin-bottom: 0.9rem; }
    h1 { font-size: 1.15rem; }
    h2 { font-size: 0.98rem; }
    .q-card { padding: 0.7rem 0.75rem; }
    .q-card h3, .cross-table-wrap h3 { font-size: 0.86rem; }
    .stat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
    .stat-box { padding: 0.65rem 0.75rem; }
    .stat-box .num { font-size: 1.15rem; }
    table.cross-table { font-size: 0.72rem; }
    table.cross-table th, table.cross-table td { padding: 0.3rem 0.4rem; white-space: nowrap; }
    table.cross-table td:first-child { max-width: 8rem; white-space: normal; }
    pre.freetext-list { font-size: 0.78rem; }
  }
</style>
